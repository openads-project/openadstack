# Remote compose file with overrides defined here can be rendered by
# `../../scripts/render_compose_sources.py`

include:
  # https://github.com/openads-project/lanelet2_route_planning/blob/v1.1.0/docker/compose/docker-compose.yml
  - oci://ghcr.io/openads-project/lanelet2_route_planning:compose-v1.1.0

services:

  lanelet2-route-planning:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    environment:
      # --- name ------
      NAMESPACE: /planning
      # --- inputs ----
      EGO_DATA_TOPIC: /localization/ego_state_estimation/ego_data
      # --- other -----
      PARAMS: /params.yml
