services:

  planning.trajectory-suggestion:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yaml
      service: ros2-gpu-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/planning/trajectory_suggestion:latest
    environment:
      NAMESPACE: /planning
      NAME: trajectory_suggestion
      INPUT_TOPIC: /environment_model/rgb_bev_image
      OUTPUT_TOPIC: /planning/reference_trajectory
      USE_SIM_TIME: false
    command:
      - /bin/bash
      - -c
      - |
        ros2 launch trajectory_suggestion trajectory_suggestion.launch.py \
          input_topic:=$${INPUT_TOPIC} \
          output_topic:=$${OUTPUT_TOPIC} \
          use_sim_time_arg:=$${USE_SIM_TIME}
