services:

  planning.planning-orchestrator:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/planning/planning_orchestrator:v1.1.0
    environment:
      NAMESPACE: /planning
      NAME: planning_orchestrator
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      ROS_TRACING: ${ROS_TRACING:-false}
      EGO_DATA_IN: /ego_data
      LAT_ACTIVE_IN: /control/lat_active
      LON_ACTIVE_IN: /control/lon_active
      ROUTE_IN: /understanding/dynamic_map_enrichment/route
      TRAJECTORY_OUT: ~/reference_trajectory
      DIAGNOSTIC_STATUS_OUT: ~/diagnostic_status
      GEOFENCES_VIZ_OUT: ~/geofences_viz
      OVERLAY_TEXT_OUT: ~/overlay_text
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch planning_orchestrator planning_orchestrator.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          trace:=$${ROS_TRACING} \
          ego_data_topic:=$${EGO_DATA_IN} \
          lat_active_topic:=$${LAT_ACTIVE_IN} \
          lon_active_topic:=$${LON_ACTIVE_IN} \
          route_topic:=$${ROUTE_IN} \
          output_trajectory_topic:=$${TRAJECTORY_OUT} \
          diagnostic_status_topic:=$${DIAGNOSTIC_STATUS_OUT} \
          geofences_viz_topic:=$${GEOFENCES_VIZ_OUT} \
          overlay_text_topic:=$${OVERLAY_TEXT_OUT}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/planning_orchestrator/share/planning_orchestrator/config/params.yml
    #   - ./reconfigurations:/docker-ros/ws/install/planning_orchestrator/share/planning_orchestrator/config/reconfigurations
