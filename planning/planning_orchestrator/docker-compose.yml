services:

  planning.planning-orchestrator:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/planning/planning_orchestrator:latest
    environment:
      EGO_DATA_TOPIC: /localization/ego_data
      ROUTE_TOPIC: /lanelet2_route_planning/route
      TRAJECTORY_TOPIC: /planning/reference_trajectory
      LAT_ACTIVE_TOPIC: ~/lat_active
      LON_ACTIVE_TOPIC: ~/lon_active
      DIAGNOSTIC_STATUS_TOPIC: ~/diagnostic_status
      GEOFENCES_MARKER_TOPIC: ~/geofences_viz
      OVERLAY_TEXT_TOPIC: ~/overlay_text
      USE_SIM_TIME: false
    command:
      - /bin/bash
      - -c
      - |
        ros2 launch planning_orchestrator planning_orchestrator.launch.py \
          ego_data_topic:=$${EGO_DATA_TOPIC} \
          route_topic:=$${ROUTE_TOPIC} \
          output_trajectory_topic:=$${TRAJECTORY_TOPIC} \
          lat_active_topic:=$${LAT_ACTIVE_TOPIC} \
          lon_active_topic:=$${LON_ACTIVE_TOPIC} \
          diagnostic_status_topic:=$${DIAGNOSTIC_STATUS_TOPIC} \
          geofences_viz_topic:=$${GEOFENCES_MARKER_TOPIC} \
          overlay_text_topic:=$${OVERLAY_TEXT_TOPIC} \
          use_sim_time:=$${USE_SIM_TIME}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/planning_orchestrator/share/planning_orchestrator/config/params.yml
    #   - ./reconfigurations:/docker-ros/ws/install/planning_orchestrator/share/planning_orchestrator/config/reconfigurations
