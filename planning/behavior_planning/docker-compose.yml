# === Environment Variables ====================================================
# - EGO_DATA_TOPIC      (optional)
# - ROUTE_TOPIC         (optional)
# - OBJECT_LIST_TOPIC   (optional)
# - IMAGE_TOPIC         (optional)
# - TRAJECTORY_TOPIC    (optional)
# - OBJECT_MARKER_TOPIC (optional)
# - ROUTE_MARKER_TOPIC  (optional)
# - PARAMS_YML          (optional)
# - USE_SIM_TIME        (optional)
# ==============================================================================

services:

  planning.behavior_planning:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/planning/behavior_planning:latest_past-input-horizon_ci
    depends_on:
      - triton-server
    command: >
      bash -ic "
      ros2 launch behavior_planning behavior_planning_launch.py
      ego_data_topic:=${EGO_DATA_TOPIC:-/localization/ego_data}
      route_topic:=${ROUTE_TOPIC:-/understanding/enriched_route}
      object_list_topic:=${OBJECT_LIST_TOPIC:-/understanding/predicted_object_list}
      image_topic:=${IMAGE_TOPIC:-/camera-front/image/compressed}
      trajectory_topic:=${TRAJECTORY_TOPIC:-/planning/reference_trajectory}
      object_marker_topic:=${OBJECT_MARKER_TOPIC:-~/visualization/object_marker}
      route_marker_topic:=${ROUTE_MARKER_TOPIC:-~/visualization/route_marker}
      use_sim_time:=${USE_SIM_TIME:-false}
      "
    volumes:
      - ${PARAMS_YML:-/dev/null:/dev/null}${PARAMS_YML:+:/docker-ros/ws/install/behavior_planning/share/behavior_planning/config/params.yml}
