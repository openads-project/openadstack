services:

  planning.trajectory-optimization:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/planning/trajectory_optimization:latest
    environment:
      NAMESPACE: /planning
      NAME: trajectory_optimization
      USE_SIM_TIME: false
      DRIVING_MODE: ackermann
      REFERENCE_TRAJECTORY_TOPIC: /planning/reference_trajectory
      TRAJECTORY_TOPIC: /planning/drivable_trajectory
      EGO_DATA_TOPIC: /localization/ego_data
      OBJECT_LIST_TOPIC: /understanding/predicted_object_list
      ROUTE_TOPIC: /understanding/enriched_route
      EGO_CIRCLES_TOPIC: ~/visualization/ego_circles
      OBJECT_CIRCLES_TOPIC: ~/visualization/object_circles
      ROUTE_MARKER_TOPIC: ~/visualization/route_marker
    command:
      - /bin/bash
      - -c
      - |
        ros2 launch trajectory_optimization trajectory_optimization.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          driving_mode:=$${DRIVING_MODE} \
          reference_trajectory_topic:=$${REFERENCE_TRAJECTORY_TOPIC} \
          trajectory_topic:=$${TRAJECTORY_TOPIC} \
          ego_data_topic:=$${EGO_DATA_TOPIC} \
          object_list_topic:=$${OBJECT_LIST_TOPIC} \
          route_topic:=$${ROUTE_TOPIC} \
          ego_circles_topic:=$${EGO_CIRCLES_TOPIC} \
          object_circles_topic:=$${OBJECT_CIRCLES_TOPIC} \
          route_marker_topic:=$${ROUTE_MARKER_TOPIC}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/trajectory_optimization/share/trajectory_optimization/config/params.yml
