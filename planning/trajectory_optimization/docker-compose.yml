services:

  planning.trajectory-optimization:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/planning/trajectory_optimization:v1.1.0
    environment:
      NAMESPACE: /planning
      NAME: trajectory_optimization
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      ROS_TRACING: ${ROS_TRACING:-false}
      DRIVING_MODE: ackermann
      EGO_DATA_IN: /ego_data
      OBJECT_LIST_IN: /understanding/lanelet2_object_list_prediction/object_list
      REFERENCE_TRAJECTORY_IN: /planning/planning_orchestrator/reference_trajectory
      ROUTE_IN: /understanding/dynamic_map_enrichment/route
      TRAJECTORY_OUT: ~/drivable_trajectory
      EGO_CIRCLES_OUT: ~/visualization/ego_circles
      OBJECT_CIRCLES_OUT: ~/visualization/object_circles
      ROUTE_MARKER_OUT: ~/visualization/route_marker
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch trajectory_optimization trajectory_optimization.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          trace:=$${ROS_TRACING} \
          driving_mode:=$${DRIVING_MODE} \
          ego_data_topic:=$${EGO_DATA_IN} \
          object_list_topic:=$${OBJECT_LIST_IN} \
          reference_trajectory_topic:=$${REFERENCE_TRAJECTORY_IN} \
          route_topic:=$${ROUTE_IN} \
          trajectory_topic:=$${TRAJECTORY_OUT} \
          ego_circles_topic:=$${EGO_CIRCLES_OUT} \
          object_circles_topic:=$${OBJECT_CIRCLES_OUT} \
          route_marker_topic:=$${ROUTE_MARKER_OUT}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/trajectory_optimization/share/trajectory_optimization/config/params.yml
