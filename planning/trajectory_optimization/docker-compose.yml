# === Environment Variables ====================================================
# - DRIVING_MODE                (optional)
# - REFERENCE_TRAJECTORY_TOPIC  (optional)
# - TRAJECTORY_TOPIC            (optional)
# - EGO_DATA_TOPIC              (optional)
# - OBJECT_LIST_TOPIC           (optional)
# - OBJECT_CIRCLES_TOPIC        (optional)
# - USE_SIM_TIME                (optional)
# - PARAMS_YML                  (required)
# ==============================================================================

services:

  planning.trajectory-optimization:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/planning/trajectory_optimization:latest
    command: >
      bash -ic "
      ros2 launch trajectory_optimization trajectory_optimization.launch.py
      driving_mode:=${DRIVING_MODE:-ackermann}
      reference_trajectory_topic:=${REFERENCE_TRAJECTORY_TOPIC:-/planning/reference_trajectory}
      trajectory_topic:=${TRAJECTORY_TOPIC:-/planning/drivable_trajectory}
      ego_data_topic:=${EGO_DATA_TOPIC:-/localization/ego_data}
      object_list_topic:=${OBJECT_LIST_TOPIC:-/understanding/predicted_object_list}
      object_circles_topic:=${OBJECT_CIRCLES_TOPIC:-/planning/trajectory_optimization/visualization/object_circles}
      use_sim_time:=${USE_SIM_TIME:-false}
      "
    volumes:
      - ${PARAMS_YML}:/docker-ros/ws/install/trajectory_optimization/share/trajectory_optimization/config/params.yml