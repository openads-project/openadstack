/**:
  ros__parameters:
    ### ROS node parameters
    vehicle_frame_id: base_link     # Frame ID of local vehicle frame (the ocp is defined in this frame)
    trajectory_frame_id: base_link  # Frame ID of output trajectory
    fixed_over_time_frame_id: map   # Frame ID of frame that is fixed over time for finding temporal transforms
    optimization_frequency: 10.0    # frequency of the optimization loop [Hz]
    standstill_threshold: 0.3       # threshold for standstill detection [m/s]. If all state velocities are below this threshold, publish standstill trajectory
    high_level_stabilization: False # init first trajectory point with: current EgoData (True); interpolation of last trajectory -> bi-level (False)
    use_prediction: True            # use obstacle predictions for optimization (True) or only static obstacles (False)
    verbose: True                   # print debug infromation and solver statistics

    #### thresholds for bi-level stabilization
    bi_level_dV: 5.0                # maximum v difference before bi-level stabilization hits [m/s]
    bi_level_dA: 2.0                # maximum a difference before bi-level stabilization hits [m/s²]
    bi_level_dY: 0.2                # maximum y-offset before bi-level stabilization hits [m]
    bi_level_dYaw: 6.0              # maximum yaw difference before bi-level stabilization hits [degree]
    bi_level_dDelta: 5.0           # maximum ackermann delta difference before bi-level stabilization hits [degree]

    ### general parameters defining the ocp
    model_name: 'trajectory_planning' # name of the acados model
    optimization_horizon: 5.0         # optimization horizon [s] (also used in ROS node)
    n_shots: 50                       # number of shooting intervals in optimization horizon (also used in ROS node)

    #### vehicle specific parameters
    wheelbase: 2.711                  # wheelbase [m] (also used in ROS node)
    length: 4.799                     # length [m]
    width: 1.855                      # width [m]
    offset2geocenter: [1.281, 0.0]    # [long (x),lat (y)] distance from vehicle-frame to geometric center [m]
    n_ego_circles: 1                  # number of circles to discretize ego-vehicle geometry
    delta_max: 0.4956735              # max. absolute steering angle [rad]
    v_min: 0.0                        # lower boundary constraint for longitudinal velocity [m/s]
    v_max: 7.0                        # upper boundary constraint for longitudinal velocity [m/s]
    acceleration_max: 8.0             # max. absolute acceleration [m/s²]
    acceleration_lon_max: 3.5         # max. absolute longitudinal acceleration [m/s²]
    alpha_max: 0.5                    # max. absolute steering rate [rad/s]
    jerk_max: 4.0                     # max. absolute longitudinal jerk [m/s²]

    ### cost scaling factors
    c_lat: 0.5 # distance to scale the lateral deviation costs [m]
    c_x: 1.0 # distance to scale the x deviation costs [m]
    c_y: 1.0 # distance to scale the y deviation costs [m]
    c_alon: 3.0 # acceleration magnitude-value for scaling acceleration costs [m/s²]
    c_alat: 3.0 # acceleration magnitude-value for scaling acceleration costs [m/s²]
    c_jlat: 3.0 # jerk-value for scaling the lateral jerk costs [m/s³]
    c_jlon: 3.0 # jerk-value for scaling the longitudinal jerk costs [m/s³]
    c_alpha: 0.35 # steering-rate-value for scaling the steering-rate costs [rad/s]

    #### cost weights
    cost_weights:
      - 0.3  # dlat (0)
      - 0.0  # x (1)
      - 0.0  # y (2)
      - 0.15 # v (3)
      - 0.0  # obstacles (4)
      - 0.15 # a_lat (5)
      - 0.2  # a_lon_pos (6)
      - 0.05 # a_lon_neg (7)
      - 0.1  # j_lat (8)
      - 0.1  # j_lon_pos (9)
      - 0.05 # j_lon_neg (10)
      - 0.03 # alpha (11)
      - 1.0  # endYaw (12)
    dynamic_weight: 1.0                         # base for exponential weight (also used in ROS node)
    slack_weights:                              # [v, a_lon, a_squared], see constraints.py in acados_ocp
      linear_lower: [1000.0, 0.1, 0.1]          # Linear cost on lower bound slack variables 
      linear_upper: [0.1, 0.1, 0.1]             # Linear cost on upper bound slack variables
      quadratic_lower: [1000.0, 1000.0, 1000.0] # Quadratic cost on lower bound slack variables
      quadratic_upper: [1000.0, 1000.0, 1000.0] # Quadratic cost on upper bound slack variables

    # other cost params
    thw: 2.0

    ### parameter vector structure
    # [cost_weights, ref_path, objects]
    p_cost_weights_shape: [13, 1] # nWeights x weightDim
    p_ref_path_shape: [51, 4]     # nStates x stateDim
    p_obstacles_shape: [10, 5]    # nObstacles x [x, y, yaw, length, width]