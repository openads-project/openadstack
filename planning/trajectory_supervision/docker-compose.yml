# === Environment Variables ====================================================
# - INPUT_TOPIC
# - OUTPUT_TOPIC
# - USE_SIM_TIME
# ==============================================================================

services:

  trajectory-supervision:
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/planning/trajectory_supervision:latest
    command: ros2 launch trajectory_supervision trajectory_supervision.launch.py input_topic:=${INPUT_TOPIC:-/planning/reference_trajectory} output_topic:=${OUTPUT_TOPIC:-/planning/drivable_trajectory} use_sim_time_arg:=${USE_SIM_TIME:-false}
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service