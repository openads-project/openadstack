services:

  planning.trajectory-supervision:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/planning/trajectory_supervision:latest
    environment:
      NAMESPACE: /planning
      NAME: trajectory_supervision
      INPUT_TOPIC: /planning/reference_trajectory
      OUTPUT_TOPIC: /planning/drivable_trajectory
      USE_SIM_TIME: false
    command:
      - /bin/bash
      - -c
      - |
        ros2 launch trajectory_supervision trajectory_supervision.launch.py \
          input_topic:=$${INPUT_TOPIC} \
          output_topic:=$${OUTPUT_TOPIC} \
          use_sim_time_arg:=$${USE_SIM_TIME}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/trajectory_supervision/share/trajectory_supervision/config/params.yml
