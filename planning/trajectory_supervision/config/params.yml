trajectory_supervision_node:
  ros__parameters:
    ### Supervisor settings parameters
    supervisor_timer_frequency: 4.0               # frequency for timer callback of supervisor in Hz
    output_rate: 4.0                              # defines duration between steps of output samples in Hz
    splining_step_size: 0.01                      # ratio that defines discretization of splining step, 0.01 ratio means 100 steps between samples
    splining_alpha: 0.5                           # parameterization of catmull-rom splines (0.5 is centripedal parameterization to avoid self-intersections)
    evaluation_mode: false                        # minimal setting working without the full carla compose pipeline for debugging purposes

    ### General settings parameters
    horizon: 8.0                                  # time that a planned trajectory is intended to cover in the future in s

    ### Vehicle settings parameters
    wheel_base: 2.711                             # length in m

    ### Drivability parameters
    a_max: 0.35                                   # acceleration in g
    dec_max: 0.5                                  # deceleration in g
    a_abs_max: 0.9                                # total acceleration in g (to investigate lateral acceleration boundaries depending on longitudinal conditions)
    delta_max: 0.5                                # steeering angle in rad
    alpha_max: 0.9                                # steering rate in rad/s
    drivability_safety_factor: 1.3                # safety factor to counter discretization errors during velocity profile fitting
    acc_comfort_factor: 2.5                       # when acceleration/deceleration is applied in non-critical situation, acceleration with max values is not desirable
    sample_deletion_window: 1                     # window size (in both directions, front and back) defining trajectory sample points for deletion in drivability response

    ### Rule test threshold parameters
    failsafe_time_threshold: 1.1                  # multiplicator for failsafe duration to determine valid planning horizons
    projection_time_threshold: 1.5                # multiplicator for failsafe duration to determine feasible route testing response
    collision_time_threshold: 1.5                 # multiplicator for failsafe duration to determine collision risk
    collision_distance_threshold: 0.5             # distance in m (determines critical distance to alert collision risk)