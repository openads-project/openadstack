services:

  planning.simple-planner:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/planning/simple_planner:latest
    environment:
      NAMESPACE: /planning
      NAME: simple_planner
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      ROS_TRACING: ${ROS_TRACING:-false}
      # inputs
      EGO_DATA_TOPIC: /localization/ego_state_estimation/ego_data
      OBJECT_LIST_TOPIC: /understanding/lanelet2_object_list_prediction/predicted_object_list
      ROUTE_TOPIC: /understanding/dynamic_map_enrichment/enriched_route
      # outputs
      TRAJECTORY_TOPIC: ~/trajectory
      OBJECT_INTERACTION_MARKERS_TOPIC: ~/object_interaction_markers
      # services
      ENABLE_LEFT_TURN_INDICATOR_SERVICE: ~/enable_left_turn_indicator
      ENABLE_RIGHT_TURN_INDICATOR_SERVICE: ~/enable_right_turn_indicator
      ENABLE_HAZARD_LIGHTS_SERVICE: ~/enable_hazard_lights
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch simple_planner simple_planner.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          trace:=$${ROS_TRACING} \
          ego_data_topic:=$${EGO_DATA_TOPIC} \
          object_list_topic:=$${OBJECT_LIST_TOPIC} \
          route_topic:=$${ROUTE_TOPIC} \
          trajectory_topic:=$${TRAJECTORY_TOPIC} \
          object_interaction_markers_topic:=$${OBJECT_INTERACTION_MARKERS_TOPIC} \
          left_turn_indicator_service:=$${ENABLE_LEFT_TURN_INDICATOR_SERVICE} \
          right_turn_indicator_service:=$${ENABLE_RIGHT_TURN_INDICATOR_SERVICE} \
          hazard_lights_service:=$${ENABLE_HAZARD_LIGHTS_SERVICE}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/simple_planner/share/simple_planner/config/params.yml
