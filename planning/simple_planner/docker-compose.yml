# === Environment Variables ====================================================
# - PARAMS_YML
# ==============================================================================

services:

  simple-planner:
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/planning/simple_planner:latest
    command: ros2 launch simple_planner simple_planner.launch.xml
    volumes:
      - ${PARAMS_YML:-./config/params.yml}:/docker-ros/ws/install/simple_planner/share/simple_planner/config/params_planner.yaml
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service