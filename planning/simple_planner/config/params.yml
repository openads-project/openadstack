/**:
  ros__parameters:

    #### general parameters
    trajectory_frame_id: base_link  # Frame ID of output trajectory
    fixed_over_time_frame_id: map   # Frame ID of frame that is fixed over time for finding temporal transforms
    frequency: 10.0
    
    #### trajectory generation parameters
    drivable_mode: False            # true: planner will generate drivable trajectories; false: planner will generate reference trajectories
    n_states: 51                    # number of states in trajectory
    v_ref: 13.89                    # constant reference velocity (m/s)
    a_max_decel: -2.5               # maximum deceleration for braking at stop lines or end of route (m/s^2)

    #### traffic light parameters
    consider_traffic_lights: True   # true: planner will consider traffic lights; false: planner will ignore traffic lights
    offset_to_stop_line: 0.0        # additional distance to stop in front of a stop line (m) (default: 0.0 -> stops with front of vehicle at stop line)