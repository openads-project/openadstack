# Perception demo override.
#
# Docker Compose profiles are additive: services without profiles are always
# enabled, even when `--profile perception` is selected. This override moves the
# recorded object-list relay into an inactive profile for perception runs.

include:
  - ./docker-compose.yml
  - ../perception/point_cloud_fusion/docker-compose.yml
  - ../perception/point_cloud_object_detection/docker-compose.yml
  
services:
  monitoring.topic-relay:
    profiles:
      - do-not-use

  point-cloud-fusion:
    volumes:
      - ./point_cloud_fusion/params.yml:/docker-ros/ws/install/point_cloud_fusion/share/point_cloud_fusion/config/params.yml

  point-cloud-object-detection:
    volumes:
      - ./point_cloud_object_detection/params.yml:/docker-ros/ws/install/point_cloud_object_detection/share/point_cloud_object_detection/config/params.yml

  triton-server:
    extends:
      file: ../essentials/triton-server/docker-compose.yml
      service: triton-server
    depends_on:
      - perception.point-cloud-object-detection-model-provisioning
    volumes:
      - perception.point-cloud-object-detection-model:/models/point-cloud-object-detection:ro

  perception.point-cloud-object-detection-model-provisioning:
    image: ghcr.io/openads-project/point_cloud_object_detection:model
    command: sleep infinity 
    volumes:
      - perception.point-cloud-object-detection-model:/model

  ros2-graph-export:
    profiles: [graph-export]
    extends:
      file: ../utils/compose/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/misc/ros2_graph_export:latest  # TODO: move to GitHub
    command:
      - /bin/bash
      - -ic
      - |
        timeout 20 ros2 run ros2_graph_export ros2_graph_export \
          --ros-args \
          -p output_path:=/docker-ros/ws/assets/ros2-graph-export.d2 \
          -p export_interval_seconds:=10.0 \
          -p ignore_topics_without_publishers:=true \
          -p ignore_topics_without_subscribers:=true
    volumes:
      - ../docs/assets:/docker-ros/ws/assets

volumes:
  perception.point-cloud-object-detection-model:
