include:

  # essentials
  - ../essentials/zenoh-router/docker-compose.yml

  # localization
  - ../localization/lanelet2_map_server/docker-compose.yml

  # perception
  - ../perception/point_cloud_fusion/docker-compose.yml
  - ../perception/point_cloud_object_detection/docker-compose.yml

  # understanding
  - ../understanding/autoware_multi_object_tracker/docker-compose.yml
  - ../understanding/lanelet2_object_list_prediction/docker-compose.yml
  
  # planning
  - ../planning/lanelet2_route_planning/docker-compose.yml
  - ../planning/simple_planner/docker-compose.yml
  - ../planning/trajectory_optimization/docker-compose.yml

  # control
  - ../control/ackermann_trajectory_control/docker-compose.yml

  # monitoring
  - ../monitoring/monitoring/docker-compose.yml

services:

  monitoring:
    volumes:
      - ./utils/rviz/conf.rviz:/conf.rviz
      - ./utils/mesh:/mesh

  lanelet2-map-server:
    volumes:
      - ./lanelet2_map_server/params.yml:/docker-ros/ws/install/lanelet2_map_server/share/lanelet2_map_server/config/params.yml
      - ./lanelet2_map_server/maps:/data/maps

  # restart the autoware-multi-object-tracker container if the ROS clock restarts
  autoware-multi-object-tracker:
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - |
          set -o pipefail
          source /opt/ros/"$${ROS_DISTRO}"/setup.bash
          now="$$(timeout 5 ros2 topic echo /clock --once --field clock.sec 2>/dev/null | head -n 1)" || exit 1
          previous="$$(cat /tmp/last-ros-clock 2>/dev/null || echo "$$now")"
          echo "$$now" > /tmp/last-ros-clock
          (( now >= previous )) || { kill -TERM 1; exit 1; }
      interval: 1s
      timeout: 10s
      start_period: 5s
      retries: 3
