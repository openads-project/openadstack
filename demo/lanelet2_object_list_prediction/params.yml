/**/*:
  ros__parameters:
    ll2_map_server_name: /localization/lanelet2_map_server
    lanelet_match_max_distance_m: 0.1
    lanelet_match_max_yaw_diff_rad: 1.57079632679
    prediction_horizon_s: 8.0
    prediction_sample_interval_s: 0.5
    unmatched_object_prediction_mode: static
    infeasible_prediction_probability: 0.0
    max_longitudinal_acceleration_mps2: 1.0     # maximum acceleration for regaining the current speed after slowing down
    max_longitudinal_deceleration_mps2: 3.0     # maximum deceleration for slowing down, e.g. before a curve or a yield line
    participant_specific_matching:
      enable: true                              # match and route pedestrians and two-wheelers with their own traffic rules, preferring bicycle lanes for two-wheelers
      allow_opposite_direction: true            # predict two-wheelers without a legal lanelet match against a lanelet's direction
    motion_limits:
      enable: true                              # reduce the predicted speed in curves to respect the acceleration limits
      max_lateral_acceleration_mps2: 3.0        # maximum lateral acceleration of predicted objects in curves
    yielding:
      enable: true                              # stop objects at yield lines for conflicting priority traffic
