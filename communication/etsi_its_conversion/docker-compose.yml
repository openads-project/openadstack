services:

  communication.etsi-its-conversion-receiver:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: ghcr.io/ika-rwth-aachen/etsi_its_messages:v3.4.0
    environment:
      NAMESPACE: /communication
      NAME: etsi_its_conversion_receiver
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      UDP_TOPIC: ~/udp/in
      CAM_TOPIC: ~/cam
      CPM_TS_TOPIC: ~/cpm_ts
      DENM_TOPIC: ~/denm
      MAPEM_TS_TOPIC: ~/mapem_ts
      MCM_UULM_TOPIC: ~/mcm_uulm
      SPATEM_TS_TOPIC: ~/spatem_ts
      VAM_TS_TOPIC: ~/vam
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch etsi_its_conversion converter.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          input_topic_udp:=$${UDP_TOPIC} \
          output_topic_cam:=$${CAM_TOPIC} \
          output_topic_cpm_ts:=$${CPM_TS_TOPIC} \
          output_topic_denm:=$${DENM_TOPIC} \
          output_topic_mapem_ts:=$${MAPEM_TS_TOPIC} \
          output_topic_mcm_uulm:=$${MCM_UULM_TOPIC} \
          output_topic_spatem_ts:=$${SPATEM_TS_TOPIC} \
          output_topic_vam_ts:=$${VAM_TS_TOPIC}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/etsi_its_conversion/share/etsi_its_conversion/config/params.yml

  communication.etsi-its-conversion-sender:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: ghcr.io/ika-rwth-aachen/etsi_its_messages:v3.4.0
    environment:
      NAMESPACE: /communication
      NAME: etsi_its_conversion_sender
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      CAM_TOPIC: /communication/ad2etsi/cam
      CPM_TS_TOPIC: /communication/ad2etsi/cpm_ts
      DENM_TOPIC: ~/denm/in
      MAPEM_TS_TOPIC: ~/mapem_ts/in
      MCM_UULM_TOPIC: ~/mcm_uulm/in
      SPATEM_TS_TOPIC:  ~/spatem_ts/in
      VAM_TS_TOPIC: ~/vam/in
      UDP_TOPIC: ~/udp
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch etsi_its_conversion converter.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          input_topic_cam:=$${CAM_TOPIC} \
          input_topic_cpm_ts:=$${CPM_TS_TOPIC} \
          input_topic_denm:=$${DENM_TOPIC} \
          input_topic_mapem_ts:=$${MAPEM_TS_TOPIC} \
          input_topic_mcm_uulm:=$${MCM_UULM_TOPIC} \
          input_topic_spatem_ts:=$${SPATEM_TS_TOPIC} \
          input_topic_vam_ts:=$${VAM_TS_TOPIC} \
          output_topic_udp:=$${UDP_TOPIC}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/etsi_its_conversion/share/etsi_its_conversion/config/params.yml
