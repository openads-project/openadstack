services:

  communication.etsi-its-conversion-receiver:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: ghcr.io/ika-rwth-aachen/etsi_its_messages:v3.4.0
    environment:
      NAMESPACE: /communication
      NAME: etsi_its_conversion_receiver
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      UDP_IN: ~/udp
      CAM_OUT: ~/cam
      CPM_TS_OUT: ~/cpm_ts
      DENM_OUT: ~/denm
      MAPEM_TS_OUT: ~/mapem_ts
      MCM_UULM_OUT: ~/mcm_uulm
      SPATEM_TS_OUT: ~/spatem_ts
      VAM_TS_OUT: ~/vam
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch etsi_its_conversion converter.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          input_topic_udp:=$${UDP_IN} \
          output_topic_cam:=$${CAM_OUT} \
          output_topic_cpm_ts:=$${CPM_TS_OUT} \
          output_topic_denm:=$${DENM_OUT} \
          output_topic_mapem_ts:=$${MAPEM_TS_OUT} \
          output_topic_mcm_uulm:=$${MCM_UULM_OUT} \
          output_topic_spatem_ts:=$${SPATEM_TS_OUT} \
          output_topic_vam_ts:=$${VAM_TS_OUT}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/etsi_its_conversion/share/etsi_its_conversion/config/params.yml

  communication.etsi-its-conversion-sender:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: ghcr.io/ika-rwth-aachen/etsi_its_messages:v3.4.0
    environment:
      NAMESPACE: /communication
      NAME: etsi_its_conversion_sender
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      CAM_IN: ~/cam
      CPM_TS_IN: ~/cpm_ts
      DENM_IN: ~/denm
      MAPEM_TS_IN: ~/mapem_ts
      MCM_UULM_IN: ~/mcm_uulm
      SPATEM_TS_IN:  ~/spatem_ts
      VAM_TS_IN: ~/vam_ts
      UDP_OUT: ~/udp
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch etsi_its_conversion converter.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          input_topic_cam:=$${CAM_IN} \
          input_topic_cpm_ts:=$${CPM_TS_IN} \
          input_topic_denm:=$${DENM_IN} \
          input_topic_mapem_ts:=$${MAPEM_TS_IN} \
          input_topic_mcm_uulm:=$${MCM_UULM_IN} \
          input_topic_spatem_ts:=$${SPATEM_TS_IN} \
          input_topic_vam_ts:=$${VAM_TS_IN}
          output_topic_udp:=$${UDP_OUT} \
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/etsi_its_conversion/share/etsi_its_conversion/config/params.yml
