name: Render compose sources

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  render-compose-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r utils/scripts/requirements.txt
      - name: Render compose sources
        run: python utils/scripts/render_compose_sources.py
      - name: Check generated files
        run: |
          git add -N .
          if ! git diff --exit-code; then
            echo "::error::utils/scripts/render_compose_sources.py changed files. Run it locally and commit the result."
            exit 1
          fi
