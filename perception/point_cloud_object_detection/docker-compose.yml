# === Environment Variables ====================================================
# - POINT_CLOUD_TOPIC (required)
# - OBJECT_LIST_TOPIC (optional)
# - PARAMS_YML        (optional)
# - MODEL_CONFIGS     (optional)
# ==============================================================================

services:

  perception.point-cloud-object-detection-fr:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/perception/point_cloud_object_detection:latest
    depends_on:
      - triton-server
    command: >
      bash -ic "
      ros2 launch point_cloud_object_detection point_cloud_object_detection.launch.py
      namespace:=/perception
      name:=front_right
      point_cloud_topic:=${POINT_CLOUD_TOPIC_FR}
      object_list_topic:=${OBJECT_LIST_TOPIC_FR:-/perception/point_cloud_object_detection/object_list_fr}
      "
    volumes:
      - ${PARAMS_YML_FR:-/dev/null:/dev/null0}${PARAMS_YML_FR:+:/docker-ros/ws/install/point_cloud_object_detection/share/point_cloud_object_detection/config/params.yml}
      - ${MODEL_CONFIGS_FR:-/dev/null:/dev/null1}${MODEL_CONFIGS_FR:+:/docker-ros/ws/install/point_cloud_object_detection/share/point_cloud_object_detection/models}

  perception.point-cloud-object-detection-fl:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/perception/point_cloud_object_detection:latest
    depends_on:
      - triton-server
    command: >
      bash -ic "
      ros2 launch point_cloud_object_detection point_cloud_object_detection.launch.py
      namespace:=/perception
      name:=front_left
      point_cloud_topic:=${POINT_CLOUD_TOPIC_FL}
      object_list_topic:=${OBJECT_LIST_TOPIC_FL:-/perception/point_cloud_object_detection/object_list_fl}
      "
    volumes:
      - ${PARAMS_YML_FL:-/dev/null:/dev/null0}${PARAMS_YML_FL:+:/docker-ros/ws/install/point_cloud_object_detection/share/point_cloud_object_detection/config/params.yml}
      - ${MODEL_CONFIGS_FL:-/dev/null:/dev/null1}${MODEL_CONFIGS_FL:+:/docker-ros/ws/install/point_cloud_object_detection/share/point_cloud_object_detection/models}

