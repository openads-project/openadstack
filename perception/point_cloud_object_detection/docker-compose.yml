services:

  perception.point-cloud-object-detection:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/perception/point_cloud_object_detection:latest
    depends_on:
      - triton-server
    environment:
      NAMESPACE: /perception
      NAME: point_cloud_object_detection
      USE_SIM_TIME: false
      ROS_TRACING: ${ROS_TRACING:-false}
      POINT_CLOUD_TOPIC: ~/point_cloud
      OBJECT_LIST_TOPIC: ~/object_list
      CLASS_POINT_CLOUD_CAR_TOPIC: ~/class_point_cloud/car
      CLASS_POINT_CLOUD_PEDESTRIAN_TOPIC: ~/class_point_cloud/pedestrian
      CLASS_POINT_CLOUD_TRUCK_TOPIC: ~/class_point_cloud/truck
      CLASS_POINT_CLOUD_TRAILER_TOPIC: ~/class_point_cloud/trailer
      CLASS_POINT_CLOUD_BUS_TOPIC: ~/class_point_cloud/bus
      CLASS_POINT_CLOUD_TWO_WHEELER_TOPIC: ~/class_point_cloud/two_wheeler
      UNCLASSIFIED_POINT_CLOUD_TOPIC: ~/unclassified_point_cloud
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch point_cloud_object_detection point_cloud_object_detection.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          trace:=$${ROS_TRACING} \
          point_cloud_topic:=$${POINT_CLOUD_TOPIC} \
          object_list_topic:=$${OBJECT_LIST_TOPIC} \
          class_point_cloud_car_topic:=$${CLASS_POINT_CLOUD_CAR_TOPIC} \
          class_point_cloud_pedestrian_topic:=$${CLASS_POINT_CLOUD_PEDESTRIAN_TOPIC} \
          class_point_cloud_truck_topic:=$${CLASS_POINT_CLOUD_TRUCK_TOPIC} \
          class_point_cloud_trailer_topic:=$${CLASS_POINT_CLOUD_TRAILER_TOPIC} \
          class_point_cloud_bus_topic:=$${CLASS_POINT_CLOUD_BUS_TOPIC} \
          class_point_cloud_two_wheeler_topic:=$${CLASS_POINT_CLOUD_TWO_WHEELER_TOPIC} \
          unclassified_point_cloud_topic:=$${UNCLASSIFIED_POINT_CLOUD_TOPIC}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/point_cloud_object_detection/share/point_cloud_object_detection/config/params.yml
    #   - ./models:/docker-ros/ws/install/point_cloud_object_detection/share/point_cloud_object_detection/models
