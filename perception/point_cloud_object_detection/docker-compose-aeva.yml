# === Environment Variables ====================================================
# - POINT_CLOUD_TOPIC_AEVA (required)
# - OBJECT_LIST_TOPIC_AEVA (optional)
# - PARAMS_YML_AEVA        (optional)
# - MODEL_CONFIGS     (optional)
# ==============================================================================

services:  
  perception.point-cloud-object-detection-aeva:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/perception/point_cloud_object_detection:latest_feature-no-detection-zone_ci-amd64
    depends_on:
      - triton-server
    command: >
      bash -ic "
      ros2 launch point_cloud_object_detection point_cloud_object_detection.launch.py
      namespace:=/perception
      name:=fused
      point_cloud_topic:=${POINT_CLOUD_TOPIC_AEVA}
      object_list_topic:=${OBJECT_LIST_TOPIC_AEVA:-/perception/point_cloud_object_detection/object_list}
      "
    volumes:
      - ${PARAMS_YML_AEVA:-/dev/null:/dev/null0}${PARAMS_YML_AEVA:+:/docker-ros/ws/install/point_cloud_object_detection/share/point_cloud_object_detection/config/params.yml}
      - ${MODEL_CONFIGS:-/dev/null:/dev/null1}${MODEL_CONFIGS:+:/docker-ros/ws/install/point_cloud_object_detection/share/point_cloud_object_detection/models}