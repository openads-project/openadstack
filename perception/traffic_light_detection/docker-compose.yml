services:

  perception.traffic-light-detection:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/perception/traffic_light_detection:v1.1.0
    depends_on:
      - triton-server
    environment:
      NAMESPACE: /perception
      NAME: traffic_light_detection
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      # inputs
      CAMERA_IMAGE_TOPIC: ~/camera_image
      CAMERA_INFO_TOPIC: ~/camera_info
      # outputs
      DETECTIONS_TOPIC: ~/detections
      VISUALIZATION_TOPIC: ~/visualization
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch traffic_light_detection tl_perception.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          camera_image_topic:=$${CAMERA_IMAGE_TOPIC} \
          camera_info_topic:=$${CAMERA_INFO_TOPIC} \
          detections_topic:=$${DETECTIONS_TOPIC} \
          visualization_topic:=$${VISUALIZATION_TOPIC}
    # volumes:
    #   - params.yml:/docker-ros/ws/install/traffic_light_detection/share/traffic_light_detection/params/tl_perception.yml
