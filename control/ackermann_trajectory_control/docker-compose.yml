services:

  control.ackermann-trajectory-control:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/control/ackermann_trajectory_control:v1.3.0
    environment:
      NAMESPACE: /control
      NAME: ackermann_trajectory_control
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      ROS_TRACING: ${ROS_TRACING:-false}
      EGO_DATA_IN: /ego_data
      LAT_CONTROL_ACTIVE_IN: /control/active
      LON_CONTROL_ACTIVE_IN: /control/active
      TRAJECTORY_IN: /planning/trajectory_optimization/drivable_trajectory
      CONTROLS_OUT: ~/ackermann_cmd
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch ackermann_trajectory_control ackermann_trajectory_control.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          trace:=$${ROS_TRACING} \
          ego_data_topic:=$${EGO_DATA_IN} \
          lat_control_active_topic:=$${LAT_CONTROL_ACTIVE_IN} \
          lon_control_active_topic:=$${LON_CONTROL_ACTIVE_IN} \
          trajectory_topic:=$${TRAJECTORY_IN} \
          controls_topic:=$${CONTROLS_OUT}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/ackermann_trajectory_control/share/ackermann_trajectory_control/config/params.yml
