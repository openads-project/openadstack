services:

  control.ackermann-trajectory-control:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/control/ackermann_trajectory_control:latest_calc-kappa_ci
    environment:
      NAMESPACE: /control
      NAME: ackermann_trajectory_control
      USE_SIM_TIME: false
      EGO_DATA_TOPIC: /localization/ego_data
      TRAJECTORY_TOPIC: /planning/drivable_trajectory
      CONTROLS_TOPIC: /control/ackermann_cmd
      LAT_CONTROL_ACTIVE_TOPIC: /drivers/fka_dbw/lat_active
      LON_CONTROL_ACTIVE_TOPIC: /drivers/fka_dbw/lon_active
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch ackermann_trajectory_control ackermann_trajectory_control.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          ego_data_topic:=$${EGO_DATA_TOPIC} \
          trajectory_topic:=$${TRAJECTORY_TOPIC} \
          controls_topic:=$${CONTROLS_TOPIC} \
          lat_control_active_topic:=$${LAT_CONTROL_ACTIVE_TOPIC} \
          lon_control_active_topic:=$${LON_CONTROL_ACTIVE_TOPIC}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/ackermann_trajectory_control/share/ackermann_trajectory_control/config/params.yml
