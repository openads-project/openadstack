# Remote compose file with overrides defined here can be rendered by
# `../../scripts/render_compose_sources.py`

include:
  # https://github.com/openads-project/ackermann_trajectory_control/blob/v1.4.0/docker/compose/docker-compose.yml
  - oci://ghcr.io/openads-project/ackermann_trajectory_control:compose-v1.4.0

services:

  ackermann-trajectory-control:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    environment:
      # --- name ------
      NAMESPACE: /control
      # --- inputs ----
      EGO_DATA_TOPIC: /localization/ego_state_estimation/ego_data
      LAT_CONTROL_ACTIVE_TOPIC: /control/lat_active
      LON_CONTROL_ACTIVE_TOPIC: /control/lon_active
      TRAJECTORY_TOPIC: /planning/trajectory_optimization/trajectory
      # --- other -----
      PARAMS: /params.yml
