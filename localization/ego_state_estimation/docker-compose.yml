services:

  localization.ego-state-estimation:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/localization/ego_state_estimation:v1.1.0
    environment:
      NAMESPACE: /localization
      NAME: ego_state_estimation
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      IMU_ACC_IN: ~/imu_acc
      NAV_SAT_FIX_IN: ~/nav_sat_fix
      ODOMETRY_IN: ~/odometry
      SBG_ROT_ACCEL_IN: ~/sbg_rot_accel
      SBG_VEL_IN: ~/sbg_vel
      TRAJECTORY_IN: /planning/trajectory_optimization/drivable_trajectory
      VEHICLE_STATE_IN: ~/vehicle_state
      EGO_DATA_OUT: /ego_data
      EGO_DATA_NAV_SAT_FIX_OUT: ~/nav_sat_fix
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch ego_state_estimation ego_state_estimation_node.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          use_sim_time:=$${USE_SIM_TIME} \
          imu_acc_topic:=$${IMU_ACC_IN} \
          nav_sat_fix_topic:=$${NAV_SAT_FIX_IN} \
          odometry_topic:=$${ODOMETRY_IN} \
          sbg_rot_accel_topic:=$${SBG_ROT_ACCEL_IN} \
          sbg_vel_topic:=$${SBG_VEL_IN} \
          trajectory_topic:=$${TRAJECTORY_IN} \
          vehicle_state_topic:=$${VEHICLE_STATE_IN} \
          ego_data_topic:=$${EGO_DATA_OUT} \
          ego_data_nav_sat_fix_topic:=$${EGO_DATA_NAV_SAT_FIX_OUT}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/ego_state_estimation/share/ego_state_estimation/config/params.yml
