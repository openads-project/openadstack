# === Environment Variables ===================ATC=======================Campus=======================================Town10HD============
# - MAP_FILEPATH  (optional)  /data/maps/default/ATC.osm    /data/maps/default/CampusVaalsHalifax.osm     /data/maps/default/Town10HD.osm
# - ORIGIN_LAT    (optional)  50.908973                     50.787047                                     0
# - ORIGIN_LON    (optional)  6.230061                      6.046511                                      0                   
# ========================================================================================================================================
services:

  localization.lanelet2-map-server:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/localization/lanelet2_map_server:latest
    command: ros2 run lanelet2_map_server lanelet2_map_server --ros-args -p map_filepath:=${MAP_FILEPATH:-/data/maps/default/ATC.osm} -p origin_lat:=${ORIGIN_LAT:-50.908973} -p origin_lon:=${ORIGIN_LON:-6.230061}