# Remote compose file with overrides defined here can be rendered by
# `../../scripts/render_compose_sources.py`

include:
  # https://github.com/openads-project/monitoring/blob/init/docker/compose/docker-compose.yml
  - oci://ghcr.io/openads-project/monitoring:compose-init
  # TODO: change both lines to tagged version

services:

  monitoring:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-gpu-x11-service
    volumes:
      - ./config/conf.rviz:/conf.rviz
    environment:
      # --- name ------
      NAMESPACE: /monitoring
      # --- other -----
      CONFIG: /conf.rviz
