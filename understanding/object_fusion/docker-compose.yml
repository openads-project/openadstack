services:

  understanding.object-fusion:
    extends:
      file: ../../docker-compose-essentials/docker-compose.template.yml
      service: ros2-service
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/understanding/object_fusion:latest
    environment:
      NAMESPACE: /understanding
      NAME: object_fusion
      FUSED_OBJECT_LIST_TOPIC: /understanding/fused_object_list
      FUSED_TRAJECTORIES_TOPIC: /understanding/fused_trajectories
      USE_SIM_TIME: false
    command:
      - /bin/bash
      - -c
      - |
        ros2 launch object_fusion fusion_function_launch.py \
          namespace:=$${NAMESPACE} \
          node_name:=$${NAME} \
          fused_object_list_topic:=$${FUSED_OBJECT_LIST_TOPIC} \
          fused_trajectories_topic:=$${FUSED_TRAJECTORIES_TOPIC} \
          use_sim_time:=$${USE_SIM_TIME}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/object_fusion/share/object_fusion/config/params.yml
